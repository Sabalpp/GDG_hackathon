name: Part C - Geometry

on:
  push:
    paths:
      - 'services/geometry/**'
      - 'data/**'
      - '.github/workflows/geometry.yml'
  pull_request:
    paths:
      - 'services/geometry/**'
      - 'data/**'
      - '.github/workflows/geometry.yml'

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: services/geometry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/geometry/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest -q
      - name: Check generated OpenAPI is current
        run: |
          python -m scripts.export_openapi
          git diff --exit-code -- ../../docs/geometry-openapi.json
      - name: Exercise a real HTTP server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(50):
              try:
                  urlopen('http://127.0.0.1:8000/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Geometry service did not start')
          PY
          python -m scripts.smoke
