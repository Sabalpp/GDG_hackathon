[project]
name = "adapt-geometry"
version = "0.1.0"
description = "Deterministic concept-layout validation and bounded planning for ADAPT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
