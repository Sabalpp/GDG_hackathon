  <rect width="1000" height="720" fill="#fff"/>
  <g fill="none" stroke="#15251d" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M120 120H870V620H120Z"/>
    <path d="M420 120V260 M420 320V620"/>
    <path d="M590 120V235 M590 295V385 M590 445V620"/>
    <path d="M120 370H225 M285 370H420"/>
    <path d="M590 400H680 M740 400H870"/>
  </g>
  <g fill="none" stroke="#597064" stroke-width="3">
    <path d="M420 260a60 60 0 0 1 60 60 M590 235a60 60 0 0 1 60 60 M225 370a60 60 0 0 1 60 60 M680 400a60 60 0 0 1 60 60"/>
    <path d="M120 72H870 M120 62V82 M870 62V82 M925 120V620 M915 120H935 M915 620H935"/>
